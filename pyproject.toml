[project]
name = "business-automation-kit"
version = "1.0.0"
description = "Lead form to Google Sheets and Telegram, daily summary, weekly Excel report, stale lead reminders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic-settings>=2.16",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "gspread>=6.2",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "openpyxl>=3.1",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
